<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" width="560" height="150" role="img" aria-label="green dot.">
  <!--
    ┌──────────────────────────────────────────────────────────────┐
    │ PLACEHOLDER — replace this file with the real logo.svg.       │
    │                                                              │
    │ The style guide names logo.svg as the locked, final wordmark, │
    │ but the file did not arrive with it. This stands in so the    │
    │ rest of the site could be built and so the landing page is    │
    │ real rather than empty.                                       │
    │                                                              │
    │ To swap it: drop the supplied file in at public/logo.svg.     │
    │ Nothing in the code references anything but this path, so     │
