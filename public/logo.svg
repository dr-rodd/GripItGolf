    └──────────────────────────────────────────────────────────────┘
  -->
  <text x="0" y="112"
        font-family="'Clash Display', 'Archivo', ui-sans-serif, system-ui, sans-serif"
        font-size="128"
        font-weight="600"
        letter-spacing="-4"
        fill="#4A3728">green dot</text>
  <circle cx="516" cy="100" r="17" fill="#0A9D56"/>
