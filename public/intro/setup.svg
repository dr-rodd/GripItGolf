<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 700" width="360" height="700"><rect width="360" height="700" fill="#F6F4F0"/><text x="16" y="30" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-size="21" font-weight="700" fill="#4A3728" letter-spacing="-0.5">settings</text><circle cx="120" cy="29" r="3.6" fill="#0A9D56"/><line x1="0" y1="44" x2="360" y2="44" stroke="rgba(74,55,40,0.14)"/><rect x="16" y="58" width="328" height="66" rx="12" fill="#FFFFFF" stroke="rgba(74,55,40,0.14)"/><rect x="28" y="72" width="30" height="30" rx="8" fill="#F6F4F0"/><circle cx="43" cy="87" r="3" stroke="#4A3728" stroke-width="1.6" fill="none"/><circle cx="43" cy="87" r="6.2" stroke="#4A3728" stroke-width="1.6" fill="none" stroke-dasharray="2.4 2.1"/><text x="70" y="82" font-family="Georgia,'Times New Roman',serif" font-size="14.5" font-weight="700" fill="#2B2118" text-anchor="start">Trip Settings</text><text x="70" y="100" font-family="Georgia,'Times New Roman',serif" font-size="11.5" font-weight="400" fill="rgba(43,33,24,0.75)" text-anchor="start">Name, dates, itinerary and stats —</text><text x="70" y="115" font-family="Georgia,'Times New Roman',serif" font-size="11.5" font-weight="400" fill="rgba(43,33,24,0.75)" text-anchor="start">leaderboards are below</text><text x="330" y="96" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="rgba(43,33,24,0.55)" text-anchor="end">›</text><rect x="16" y="138" width="328" height="452" rx="12" fill="#FFFFFF" stroke="rgba(74,55,40,0.14)"/><text x="32" y="168" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0A6B3C" text-anchor="start" letter-spacing="2">LEADERBOARDS</text><text x="32" y="188" font-family="Georgia,'Times New Roman',serif" font-size="11.5" font-weight="400" fill="rgba(43,33,24,0.75)" text-anchor="start">Choose your Competition Leaderboards. Add as</text><text x="32" y="203" font-family="Georgia,'Times New Roman',serif" font-size="11.5" font-weight="400" fill="rgba(43,33,24,0.75)" text-anchor="start">many formats as you like.</text><rect x="30" y="218" width="300" height="128" rx="12" fill="#FFFFFF" stroke="rgba(74,55,40,0.14)"/><text x="44" y="246" font-family="Georgia,'Times New Roman',serif" font-size="17" font-weight="700" fill="#2B2118" text-anchor="start">Stableford Points</text><rect x="44" y="256" width="74" height="20" rx="10" fill="rgba(10,157,86,0.16)"/><text x="81" y="270" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#0A6B3C" text-anchor="middle" letter-spacing="1.2">PRIMARY</text><text x="44" y="296" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="rgba(43,33,24,0.75)" text-anchor="start">Stableford points. Man's greatest achievement.</text><text x="44" y="311" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="rgba(43,33,24,0.75)" text-anchor="start">One running total across the trip. Worst round</text><text x="44" y="326" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="rgba(43,33,24,0.75)" text-anchor="start">dropped. Played off 90% of course handicap.</text><rect x="30" y="360" width="300" height="104" rx="12" fill="#FFFFFF" stroke="rgba(74,55,40,0.14)"/><text x="44" y="388" font-family="Georgia,'Times New Roman',serif" font-size="17" font-weight="700" fill="#2B2118" text-anchor="start">Team better ball</text><text x="44" y="410" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="rgba(43,33,24,0.75)" text-anchor="start">A composite card: the team's best score on</text><text x="44" y="425" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="rgba(43,33,24,0.75)" text-anchor="start">every hole, and everyone counts on the last 3.</text><rect x="30" y="478" width="300" height="96" rx="12" fill="#FFFFFF" stroke="rgba(74,55,40,0.14)"/><text x="44" y="506" font-family="Georgia,'Times New Roman',serif" font-size="17" font-weight="700" fill="#2B2118" text-anchor="start">Matchplay knockout</text><text x="44" y="528" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="rgba(43,33,24,0.75)" text-anchor="start">A seeded singles draw. Quarter-finals through</text><text x="44" y="543" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="rgba(43,33,24,0.75)" text-anchor="start">to the final, settled from the cards.</text></svg>