<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 728" width="360" height="728"><rect width="360" height="728" fill="#F6F4F0"/><text x="16" y="30" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-size="21" font-weight="700" fill="#4A3728" letter-spacing="-0.5">settings</text><circle cx="120" cy="29" r="3.6" fill="#0A9D56"/><line x1="0" y1="44" x2="360" y2="44" stroke="rgba(74,55,40,0.14)"/><rect x="16" y="58" width="328" height="66" rx="12" fill="#FFFFFF" stroke="rgba(74,55,40,0.14)"/><rect x="28" y="72" width="30" height="30" rx="8" fill="#F6F4F0"/><circle cx="43" cy="87" r="3" stroke="#4A3728" stroke-width="1.6" fill="none"/><circle cx="43" cy="87" r="6.2" stroke="#4A3728" stroke-width="1.6" fill="none" stroke-dasharray="2.4 2.1"/><text x="70" y="82" font-family="Georgia,'Times New Roman',serif" font-size="14.5" font-weight="700" fill="#2B2118" text-anchor="start">Trip Settings</text><text x="70" y="100" font-family="Georgia,'Times New Roman',serif" font-size="11.5" font-weight="400" fill="rgba(43,33,24,0.75)" text-anchor="start">Name, dates, itinerary and stats —</text><text x="70" y="115" font-family="Georgia,'Times New Roman',serif" font-size="11.5" font-weight="400" fill="rgba(43,33,24,0.75)" text-anchor="start">leaderboards are below</text><text x="330" y="96" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="rgba(43,33,24,0.55)" text-anchor="end">›</text><rect x="16" y="140" width="328" height="450" rx="12" fill="#FFFFFF" stroke="rgba(74,55,40,0.14)"/><text x="32" y="168" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0A6B3C" text-anchor="start" letter-spacing="2">LEADERBOARDS</text><text x="32" y="188" font-family="Georgia,'Times New Roman',serif" font-size="11.5" font-weight="400" fill="rgba(43,33,24,0.75)" text-anchor="start">Choose your Competition Leaderboards. Add as</text><text x="32" y="203" font-family="Georgia,'Times New Roman',serif" font-size="11.5" font-weight="400" fill="rgba(43,33,24,0.75)" text-anchor="start">many formats as you like.</text><rect x="30" y="348" width="300" height="130" rx="12" fill="#FFFFFF" stroke="rgba(74,55,40,0.14)"/><text x="44" y="376" font-family="Georgia,'Times New Roman',serif" font-size="17" font-weight="700" fill="#2B2118" text-anchor="start">Stableford Points</text><rect x="44" y="386" width="74" height="20" rx="10" fill="rgba(10,157,86,0.16)"/><text x="81" y="400" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#0A6B3C" text-anchor="middle" letter-spacing="1.2">PRIMARY</text><text x="44" y="426" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="rgba(43,33,24,0.75)" text-anchor="start">Stableford points. Man's greatest achievement.</text><text x="44" y="441" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="rgba(43,33,24,0.75)" text-anchor="start">One running total across the trip. Worst round</text><text x="44" y="456" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="rgba(43,33,24,0.75)" text-anchor="start">dropped. Played off 90% of course handicap.</text><rect x="30" y="492" width="300" height="96" rx="12" fill="#FFFFFF" stroke="rgba(74,55,40,0.14)"/><text x="44" y="520" font-family="Georgia,'Times New Roman',serif" font-size="17" font-weight="700" fill="#2B2118" text-anchor="start">Team better ball</text><text x="44" y="542" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="rgba(43,33,24,0.75)" text-anchor="start">A composite card: the team's best score on</text><text x="44" y="557" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="rgba(43,33,24,0.75)" text-anchor="start">every hole, and everyone counts on the last 3.</text><rect x="0" y="664" width="360" height="64" fill="#FFFFFF"/><line x1="0" y1="664" x2="360" y2="664" stroke="rgba(74,55,40,0.14)"/><path d="M30 692 L38 683 L46 692 M32.5 690 V698 H43.5 V690" stroke="rgba(43,33,24,0.55)" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="720" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="rgba(43,33,24,0.55)" text-anchor="middle">Home</text><rect x="102.5" y="682" width="13" height="16" rx="2.5" stroke="rgba(43,33,24,0.55)" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="106" y="680" width="6" height="4" rx="1.5" fill="rgba(43,33,24,0.55)"/><path d="M106 690 H112 M106 694 H112" stroke="rgba(43,33,24,0.55)" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="109" y="720" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="rgba(43,33,24,0.55)" text-anchor="middle">Scoring</text><path d="M174 682 H186 V687 A6 6 0 0 1 174 687 Z M180 693 V696 M176 697 H184" stroke="rgba(43,33,24,0.55)" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="720" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="rgba(43,33,24,0.55)" text-anchor="middle">Leaderboard</text><path d="M244 698 V691 M251 698 V683 M258 698 V688" stroke="rgba(43,33,24,0.55)" stroke-width="3" stroke-linecap="round" fill="none"/><text x="251" y="720" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="rgba(43,33,24,0.55)" text-anchor="middle">Stats</text><circle cx="322" cy="690" r="17" fill="rgba(10,157,86,0.10)"/><circle cx="322" cy="690" r="3" stroke="#0A6B3C" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="322" cy="690" r="7" stroke="#0A6B3C" stroke-width="1.7" fill="none" stroke-dasharray="2.6 2.3"/><text x="322" y="720" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-size="8.5" 