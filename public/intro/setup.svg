unts on the last 3.</text><rect y="533" width="360" height="52" fill="#FFFFFF"/><line x1="0" y1="533" x2="360" y2="533" stroke="rgba(74,55,40,0.14)"/><path d="M30 552 L36 546 L42 552 M32 551 V557 H40 V551" stroke="rgba(74,55,40,0.6)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="573" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="rgba(74,55,40,0.6)">Home</text><rect x="103" y="545" width="10" height="12" rx="2" stroke="rgba(74,55,40,0.6)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="105.5" y1="549" x2="110.5" y2="549" stroke="rgba(74,55,40,0.6)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="105.5" y1="552.5" x2="110.5" y2="552.5" stroke="rgba(74,55,40,0.6)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="108" y="573" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="rgba(74,55,40,0.6)">Scoring</text><path d="M175.5 545 H184.5 V549 A4.5 4.5 0 0 1 175.5 549 Z M180 553.5 V556 M176.5 557 H183.5" stroke="rgba(74,55,40,0.6)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="573" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="rgba(74,55,40,0.6)">Leaderboard</text><path d="M246.5 557 V550 M252 557 V545 M257.5 557 V548" stroke="rgba(74,55,40,0.6)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="252" y="573" text-anchor="middle" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="400" fill="rgba(74,55,40,0.6)">Stats</text><circle cx="324" cy="551" r="3" stroke="#0A9D56" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="324" cy=